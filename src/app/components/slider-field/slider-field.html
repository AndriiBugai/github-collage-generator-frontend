<div class="label-row">
  <label [attr.for]="labelId">{{ label() }}</label>
  <span aria-hidden="true">{{ currentValue() }}</span>
</div>

<div class="slider">
  <mat-slider discrete
              [min]="min()"
              [max]="max()">
    <input matSliderThumb
           [id]="labelId"
           [formField]="field()"/>
  </mat-slider>
</div>
