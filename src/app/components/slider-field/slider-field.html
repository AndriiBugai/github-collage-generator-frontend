<div class="label-row">
  <label [attr.for]="labelId">{{ label() }}</label>
  <span aria-hidden="true">{{ value() }}</span>
</div>

<div class="slider">
  <mat-slider discrete
              [min]="minVal()"
              [max]="maxVal()">
    <input matSliderThumb
           [id]="labelId"
           [value]="value()"
           (valueChange)="value.set($event)"/>
  </mat-slider>
</div>
