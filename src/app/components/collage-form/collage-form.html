<form class="form"
      (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline">
    <mat-label>
      GitHub Username
    </mat-label>
    <input matInput
           [formField]="collageForm.username"
           placeholder="e.g. octocat"/>
    <mat-hint>GitHub user for which collage will be generated</mat-hint>
    @if (collageForm.username().touched() && collageForm.username().errors().length) {
      <mat-error>{{ collageForm.username().errors()[0].message }}</mat-error>
    }
  </mat-form-field>

  <app-slider-field label="Collage Size"
                    [min]="limits.collageSize.min"
                    [max]="limits.collageSize.max"
                    [field]="collageForm.collageSize"/>

  <app-slider-field label="Tile Size (px)"
                    [min]="limits.tileSize.min"
                    [max]="limits.tileSize.max"
                    [field]="collageForm.tileSize"/>

  <button class="gen-btn"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading()">
    @if (isLoading()) {
      <mat-spinner diameter="20"/>
    } @else {
      Generate Collage
    }
  </button>
</form>
