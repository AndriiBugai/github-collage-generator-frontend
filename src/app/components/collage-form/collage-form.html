<form class="form"
      (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline">
    <mat-label>
      GitHub Username
    </mat-label>
    <input matInput
           [formField]="collageForm.username"
           placeholder="e.g. octocat"/>
    <mat-hint>GitHub user for which collage will be generated</mat-hint>
    @if (collageForm.username().touched() && collageForm.username().errors().length) {
      <mat-error>{{ collageForm.username().errors()[0].message }}</mat-error>
    }
  </mat-form-field>

  <div class="slider-field">
    <mat-form-field appearance="outline" class="value-display">
      <mat-label>Collage Size</mat-label>
      <input matInput [value]="collageForm.collageSize().value()" disabled/>
    </mat-form-field>
    <mat-slider [min]="limits.collageSize.min" [max]="limits.collageSize.max" discrete>
      <input matSliderThumb [formField]="collageForm.collageSize"/>
    </mat-slider>
  </div>

  <div class="slider-field">
    <mat-form-field appearance="outline" class="value-display">
      <mat-label>Tile Size (px)</mat-label>
      <input matInput [value]="collageForm.tileSize().value()" disabled/>
    </mat-form-field>
    <mat-slider [min]="limits.tileSize.min" [max]="limits.tileSize.max" discrete>
      <input matSliderThumb [formField]="collageForm.tileSize"/>
    </mat-slider>
  </div>

  <button class="gen-btn"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading()">
    @if (isLoading()) {
      <mat-spinner diameter="20"/>
    } @else {
      Generate Collage
    }
  </button>
</form>
