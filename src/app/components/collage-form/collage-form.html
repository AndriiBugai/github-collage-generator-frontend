<form class="form"
      (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline">
    <mat-label>GitHub Username</mat-label>
    <input matInput
           [formField]="collageForm.username"
           placeholder="e.g. octocat"/>
    <mat-hint>GitHub user for which collage will be generated</mat-hint>
    @if (collageForm.username().pending()) {
      <mat-spinner appSpinner matSuffix label="Validating username"/>
    }
    @if (collageForm.username().touched() && collageForm.username().errors().length) {
      <mat-error>
        {{ collageForm.username().errors()[0].message }}
      </mat-error>
    }
  </mat-form-field>

  <app-slider-field label="Collage Size"
                    [minVal]="limits.collageSize.min"
                    [maxVal]="limits.collageSize.max"
                    [formField]="collageForm.collageSize"/>

  <app-slider-field label="Tile Size (px)"
                    [minVal]="limits.tileSize.min"
                    [maxVal]="limits.tileSize.max"
                    [formField]="collageForm.tileSize"/>

  <button class="gen-btn"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading()">
    @if (isLoading()) {
      <mat-spinner appSpinner label="Generating collage"/>
    } @else {
      Generate Collage
    }
  </button>
</form>
